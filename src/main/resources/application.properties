spring.application.name=swimpoolschedule

# Pool configuration ? increase to expand lanes/capacity
pool.max-capacidade=4

# Pretty-print JSON responses
spring.jackson.serialization.indent-output=true

# H2 and JPA
spring.datasource.url=jdbc:h2:mem:swimpoolschedule;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

